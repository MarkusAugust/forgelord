# Every open board holds a stream, and every stream holds a thread. A virtual thread each
# costs next to nothing, where Boot's default pool of 8 would make the ninth reader wait.
spring.threads.virtual.enabled=true

# An open board never finishes on its own, so a graceful shutdown would wait out its whole
# timeout for streams that are not coming back. Datastar reconnects them when the app is up again.
spring.lifecycle.timeout-per-shutdown-phase=2s

# Where the Ledger answers. In a real app this is another service's address. Here the Ledger runs
# in this same app, so the address is this app's own port, known once the server is listening.
forgelord.ledger.url=http://localhost:${local.server.port}
# How often the board asks the Ledger, while anyone has it open.
forgelord.ledger.poll-interval=2s
